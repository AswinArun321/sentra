{% load static %}
<header class="public-navbar">
  <div class="public-container">
    <div class="navbar-inner">
      <!-- Brand -->
      <a href="{% url 'home' %}" class="nav-brand" aria-label="SENTRA Home">
        <div class="brand-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <span class="brand-name">SENTRA<span class="brand-dot">.</span></span>
      </a>

      <!-- Desktop Navigation Menu -->
      <nav class="nav-menu" aria-label="Main Navigation">
        <a href="{% url 'home' %}" class="nav-link {% if active_page == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'about' %}" class="nav-link {% if active_page == 'about' %}active{% endif %}">About</a>
        <a href="{% url 'contact' %}" class="nav-link {% if active_page == 'contact' %}active{% endif %}">Contact</a>
      </nav>

      <!-- Nav Actions -->
      <div class="nav-actions">

        {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="btn btn-primary btn-sm">
          Dashboard
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
        {% else %}
        <a href="{% url 'login' %}" class="btn btn-secondary btn-sm">Sign In</a>
        <a href="{% url 'register' %}" class="btn btn-primary btn-sm">
          Get Started
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
        {% endif %}

        <!-- Mobile Menu Toggle Button -->
        <button type="button" class="mobile-toggle" id="mobileMenuBtn" aria-label="Toggle navigation menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-nav-drawer" id="mobileDrawer">
    <a href="{% url 'home' %}" class="mobile-nav-link">Home</a>
    <a href="{% url 'about' %}" class="mobile-nav-link">About</a>
    <a href="{% url 'contact' %}" class="mobile-nav-link">Contact</a>
    <div style="display: flex; gap: 10px; margin-top: 8px;">
      {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}" class="btn btn-primary btn-sm" style="flex: 1; justify-content: center;">Go to Dashboard</a>
      {% else %}
      <a href="{% url 'login' %}" class="btn btn-secondary btn-sm" style="flex: 1; justify-content: center;">Sign In</a>
      <a href="{% url 'register' %}" class="btn btn-primary btn-sm" style="flex: 1; justify-content: center;">Get Started</a>
      {% endif %}
    </div>
  </div>
</header>
